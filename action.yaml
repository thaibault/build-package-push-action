name: Build package and push

inputs:
  debug:
    description: Sets "NODE_ENV" to "debug".
    required: false
    default: false
  npm-token:
    description: Authentication token for npm.
    required: false

  github-release:
    description: |
      Creates a github release for the new version's tag. With a
      "package.json" the published npm package is attached as asset. Needs
      "contents: write" permission.
    required: false
    default: true

  aur-ssh-private-key:
    description: |
      Private ssh key registered in arch's user repository. Needed to publish
      an existing "PKGBUILD".
    required: false
  aur-commit-name:
    description: |
      Author name for commits pushed to arch's user repository. Defaults to
      the actor triggering the workflow.
    required: false
  aur-commit-email:
    description: |
      Author email address for commits pushed to arch's user repository.
      Defaults to the actor's no-reply github address.
    required: false

  type:
    description: Sets semantic version update type.
    default: patch
    type: choice
    options:
      - major
      - minor
      - patch
      - candidate

outputs:
  version:
    description: The version of the newly published package.
    value: ${{ steps.prepare-release.outputs.version }}

runs:
  using: composite

  steps:
    - uses: thaibault/prepare-release-action@main
      id: prepare-release
      with:
        debug: ${{ inputs.debug }}
        type: ${{ inputs.type || 'patch' }}

    # NOTE: Candidate versions can not be represented as "pkgver". All
    # following arch user repository steps only run if this step provides a
    # package name. Runs before anything is published to stop releases with
    # unpublishable local sources early.
    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        inputs.aur-ssh-private-key &&
        !contains(inputs.type, 'candidate')
      name: Prepare arch user repository content.
      id: aur
      # NOTE: "makepkg" expects local sources by their file name next to the
      # "PKGBUILD" while arch's user repository expects them at their given
      # path. So local sources are copied by their file name into a separate
      # directory together with a "PKGBUILD" referencing them accordingly
      # (e.g. "service/a.service" as "a.service").
      env:
        DIRECTORY_PATH: ${{ runner.temp }}/arch-user-repository
      run: |
        local_file_paths="$(
            source ./PKGBUILD
            for file_path in \
                "${source[@]}" "${install:-}" "${changelog:-}"
            do
                file_path="${file_path#*::}"
                [[ "$file_path" == '' || "$file_path" == *://* ]] || \
                    echo "$file_path"
            done
        )"
        rm --force --recursive "$DIRECTORY_PATH"
        mkdir "$DIRECTORY_PATH"
        pkgbuild="$(<PKGBUILD)"
        declare -A file_paths_by_name=()
        while IFS= read -r file_path; do
            [ "$file_path" = '' ] && \
                continue
            file_name="$(basename "$file_path")"
            if [[
                "${file_paths_by_name[$file_name]:-$file_path}" != \
                "$file_path"
            ]]; then
                echo "::error::Local sources \"${file_paths_by_name[$file_name]}\" and \"${file_path}\" share their file name." \
                    1>&2
                exit 1
            fi
            file_paths_by_name[$file_name]="$file_path"
            cp "$file_path" "${DIRECTORY_PATH}/${file_name}"
            [[ "$file_path" == */* ]] && \
                pkgbuild="${pkgbuild//"$file_path"/"$file_name"}"
        done <<< "$local_file_paths"
        printf '%s\n' "$pkgbuild" >"${DIRECTORY_PATH}/PKGBUILD"
        # NOTE: Local sources not written literally can not be replaced.
        remaining_file_paths="$(
            cd "$DIRECTORY_PATH"
            source ./PKGBUILD
            for file_path in \
                "${source[@]}" "${install:-}" "${changelog:-}"
            do
                file_path="${file_path#*::}"
                [[ "$file_path" != *://* && "$file_path" == */* ]] && \
                    echo "$file_path"
            done
            true
        )"
        if [ "$remaining_file_paths" != '' ]; then
            echo "::error::Local sources \"${remaining_file_paths//$'\n'/\", \"}\" could not be referenced by their file name." \
                1>&2
            exit 1
        fi
        echo "name=$(source ./PKGBUILD; echo "${pkgbase:-$pkgname}")" \
            >>"$GITHUB_OUTPUT"
      shell: bash

    # region npm
    # Setup .npmrc file to publish to npm.
    - if: steps.prepare-release.outputs.has-package-json == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: latest
        registry-url: 'https://registry.npmjs.org'
    - if: steps.prepare-release.outputs.has-package-json == 'true'
      name: Publish newly created package to npm registry.
      env:
        # Not needed anymore when using "Trusted Publishing".
        #NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NODE_ENV: ${{ contains(inputs.debug, 'true') && 'debug' || '' }}
      run: npm publish --tag ${{ contains(inputs.type, 'candidate') && 'candidate' || 'latest' }}
      shell: bash

    # Setup .npmrc file to publish to github.
    #- uses: actions/setup-node@v6
    #  with:
    #    node-version: latest
    #    registry-url: 'https://npm.pkg.github.com'
    #    # Defaults to the user or organization that owns the workflow file.
    #    scope: '@octocat'
    #- name: Publish newly created package to github registry.
    #  env:
    #    # Not needed anymore when using "Trusted Publishing".
    #    #NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
    #    NODE_ENV: ${{ contains(inputs.debug, 'true') && 'debug' || '' }}
    #  run: npm publish --tag ${{ contains(inputs.type, 'candidate') && 'candidate' || 'latest' }}
    #  shell: bash
    # endregion

    # region github release
    # NOTE: "npm publish" already ran all lifecycle scripts (e.g. "prepare"),
    # so packing again without them results in the published package content.
    - if: |
        contains(inputs.github-release, 'true') &&
        steps.prepare-release.outputs.has-package-json == 'true'
      name: Pack published npm package for the github release.
      id: pack
      env:
        DIRECTORY_PATH: ${{ runner.temp }}/github-release
      run: |
        rm --force --recursive "$DIRECTORY_PATH"
        mkdir "$DIRECTORY_PATH"
        npm pack --ignore-scripts --pack-destination "$DIRECTORY_PATH" \
            >/dev/null
        echo "file-path=$(find "$DIRECTORY_PATH" -name '*.tgz' -print -quit)" \
            >>"$GITHUB_OUTPUT"
      shell: bash

    - if: contains(inputs.github-release, 'true')
      name: Create github release.
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.prepare-release.outputs.version }}
        name: ${{ steps.prepare-release.outputs.version }}
        prerelease: ${{ contains(inputs.type, 'candidate') }}
        make_latest: ${{ !contains(inputs.type, 'candidate') }}
        generate_release_notes: true
        files: ${{ steps.pack.outputs.file-path }}
        fail_on_unmatched_files: true
    # endregion

    # region arch user repository
    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        !inputs.aur-ssh-private-key &&
        !contains(inputs.type, 'candidate')
      name: Skip publishing to arch's user repository without credentials.
      run: echo '::warning::No "aur-ssh-private-key" given, so "PKGBUILD" is not published to arch'"'"'s user repository.'
      shell: bash

    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        contains(inputs.type, 'candidate')
      name: Skip publishing candidates to arch's user repository.
      run: echo '::warning::Arch'"'"'s user repository does not support release candidates, so "PKGBUILD" is not published.'
      shell: bash

    # NOTE: Newly published sources (e.g. the npm package or the github tag
    # archive) may need some time to become available.
    - if: steps.aur.outputs.name
      name: Wait until arch package sources are available.
      run: |
        (
            source ./PKGBUILD
            for url in "${source[@]}"; do
                url="${url#*::}"
                [[ "$url" == *://* ]] || \
                    continue
                for try in {1..40}; do
                    curl \
                        --fail \
                        --location \
                        --output /dev/null \
                        --silent \
                        "$url" && \
                            continue 2
                    echo "Source \"${url}\" is not available yet (try ${try})."
                    sleep 30
                done
                echo "::error::Source \"${url}\" did not become available."
                exit 1
            done
        )
      shell: bash

    # NOTE: Arch user repository content is moved into the workspace only
    # after publishing to npm to keep it out of the npm package. It has to be
    # located there to be accessible for the following docker based action.
    - if: steps.aur.outputs.name
      name: Move arch user repository content into workspace.
      run: |
        mv "${RUNNER_TEMP}/arch-user-repository" .arch-user-repository
      shell: bash

    # NOTE: Pinned to a commit since it gets the ssh private key.
    - if: steps.aur.outputs.name
      name: Publish PKGBUILD to arch's user repository.
      uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
      # NOTE: Keeps downloaded sources, build files and built packages out of
      # the published repository since all its files are committed.
      env:
        BUILDDIR: /tmp/makepkg/build
        PKGDEST: /tmp/makepkg/packages
        SRCDEST: /tmp/makepkg/sources
      with:
        pkgname: ${{ steps.aur.outputs.name }}
        asset_dir: .arch-user-repository
        updpkgsums: true
        # NOTE: Builds the package without installing its dependencies.
        test: true
        # NOTE: Brings updated checksums back to the workspace.
        post_process: sudo cp PKGBUILD /github/workspace/.arch-user-repository/PKGBUILD
        commit_username: ${{ inputs.aur-commit-name || github.actor }}
        commit_email: ${{ inputs.aur-commit-email || format('{0}@users.noreply.github.com', github.actor) }}
        commit_message: Publish new version "${{ steps.prepare-release.outputs.version }}".
        ssh_private_key: ${{ inputs.aur-ssh-private-key }}

    # NOTE: Checksums of published sources (e.g. the npm package) are only
    # known after publishing. Only the checksum arrays are taken over since
    # the published "PKGBUILD" references local sources by their file name.
    - if: steps.aur.outputs.name
      name: Take over updated checksums.
      env:
        DIRECTORY_PATH: .arch-user-repository
      run: |
        awk '
            function is_checksums_start(line) {
                return line ~ /^[[:space:]]*(ck|md5|sha1|sha224|sha256|sha384|sha512|b2)sums(_[[:alnum:]_]+)?=\(/
            }
            FNR == 1 {
                file_number++
            }
            file_number == 1 {
                if (!in_checksums && is_checksums_start($0))
                    in_checksums = 1
                if (in_checksums) {
                    checksums = checksums $0 "\n"
                    if (index($0, ")"))
                        in_checksums = 0
                }
                next
            }
            {
                if (!in_checksums && is_checksums_start($0)) {
                    in_checksums = 1
                    if (!inserted) {
                        printf "%s", checksums
                        inserted = 1
                    }
                }
                if (in_checksums) {
                    if (index($0, ")"))
                        in_checksums = 0
                    next
                }
                print
            }
            END {
                if (!inserted)
                    printf "%s", checksums
            }
        ' "${DIRECTORY_PATH}/PKGBUILD" PKGBUILD >"${DIRECTORY_PATH}/merged"
        # NOTE: Redirecting keeps the file mode of "PKGBUILD".
        cat "${DIRECTORY_PATH}/merged" >PKGBUILD
        rm --force --recursive "$DIRECTORY_PATH"
      shell: bash

    - if: steps.aur.outputs.name
      uses: EndBug/add-and-commit@v11
      with:
        add: PKGBUILD
        message: Update "PKGBUILD" checksums for version "${{ steps.prepare-release.outputs.version }}".
    # endregion
