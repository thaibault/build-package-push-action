name: Build package and push

inputs:
  debug:
    description: Sets "NODE_ENV" to "debug".
    required: false
    default: false
  npm-token:
    description: Authentication token for npm.
    required: false

  aur-ssh-private-key:
    description: |
      Private ssh key registered in arch's user repository. Needed to publish
      an existing "PKGBUILD".
    required: false
  aur-commit-name:
    description: |
      Author name for commits pushed to arch's user repository. Defaults to
      the actor triggering the workflow.
    required: false
  aur-commit-email:
    description: |
      Author email address for commits pushed to arch's user repository.
      Defaults to the actor's no-reply github address.
    required: false

  type:
    description: Sets semantic version update type.
    default: patch
    type: choice
    options:
      - major
      - minor
      - patch
      - candidate

outputs:
  version:
    description: The version of the newly published package.
    value: ${{ steps.prepare-release.outputs.version }}

runs:
  using: composite

  steps:
    - uses: thaibault/prepare-release-action@main
      id: prepare-release
      with:
        debug: ${{ inputs.debug }}
        type: ${{ inputs.type || 'patch' }}

    # NOTE: Candidate versions can not be represented as "pkgver". All
    # following arch user repository steps only run if this step provides a
    # package name. Runs before anything is published to stop releases with
    # unpublishable local sources early.
    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        inputs.aur-ssh-private-key &&
        !contains(inputs.type, 'candidate')
      name: Determine arch package name and local sources.
      id: aur
      # NOTE: "makepkg" expects local sources by their file name next to the
      # "PKGBUILD" while arch's user repository expects them at their given
      # path, so they can not be located in a sub directory.
      run: |
        output="$(
            source ./PKGBUILD
            echo "name=${pkgbase:-$pkgname}"
            echo 'assets<<EOF'
            for file_path in \
                "${source[@]}" "${install:-}" "${changelog:-}"
            do
                file_path="${file_path#*::}"
                [[ "$file_path" == '' || "$file_path" == *://* ]] && \
                    continue
                if [[ "$file_path" == */* ]]; then
                    echo "::error::Local source \"${file_path}\" has to be located next to \"PKGBUILD\" to be published to arch's user repository." \
                        1>&2
                    exit 1
                fi
                echo "$file_path"
            done
            echo EOF
        )"
        echo "$output" >> "$GITHUB_OUTPUT"
      shell: bash

    # region npm
    # Setup .npmrc file to publish to npm.
    - if: steps.prepare-release.outputs.has-package-json == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: latest
        registry-url: 'https://registry.npmjs.org'
    - if: steps.prepare-release.outputs.has-package-json == 'true'
      name: Publish newly created package to npm registry.
      env:
        # Not needed anymore when using "Trusted Publishing".
        #NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NODE_ENV: ${{ contains(inputs.debug, 'true') && 'debug' || '' }}
      run: npm publish --tag ${{ contains(inputs.type, 'candidate') && 'candidate' || 'latest' }}
      shell: bash

    # Setup .npmrc file to publish to github.
    #- uses: actions/setup-node@v6
    #  with:
    #    node-version: latest
    #    registry-url: 'https://npm.pkg.github.com'
    #    # Defaults to the user or organization that owns the workflow file.
    #    scope: '@octocat'
    #- name: Publish newly created package to github registry.
    #  env:
    #    # Not needed anymore when using "Trusted Publishing".
    #    #NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
    #    NODE_ENV: ${{ contains(inputs.debug, 'true') && 'debug' || '' }}
    #  run: npm publish --tag ${{ contains(inputs.type, 'candidate') && 'candidate' || 'latest' }}
    #  shell: bash
    # endregion

    # region arch user repository
    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        !inputs.aur-ssh-private-key &&
        !contains(inputs.type, 'candidate')
      name: Skip publishing to arch's user repository without credentials.
      run: echo '::warning::No "aur-ssh-private-key" given, so "PKGBUILD" is not published to arch'"'"'s user repository.'
      shell: bash

    - if: |
        steps.prepare-release.outputs.has-pkgbuild == 'true' &&
        contains(inputs.type, 'candidate')
      name: Skip publishing candidates to arch's user repository.
      run: echo '::warning::Arch'"'"'s user repository does not support release candidates, so "PKGBUILD" is not published.'
      shell: bash

    # NOTE: Newly published sources (e.g. the npm package or the github tag
    # archive) may need some time to become available.
    - if: steps.aur.outputs.name
      name: Wait until arch package sources are available.
      run: |
        (
            source ./PKGBUILD
            for url in "${source[@]}"; do
                url="${url#*::}"
                [[ "$url" == *://* ]] || \
                    continue
                for try in {1..40}; do
                    curl \
                        --fail \
                        --location \
                        --output /dev/null \
                        --silent \
                        "$url" && \
                            continue 2
                    echo "Source \"${url}\" is not available yet (try ${try})."
                    sleep 30
                done
                echo "::error::Source \"${url}\" did not become available."
                exit 1
            done
        )
      shell: bash

    # NOTE: Pinned to a commit since it gets the ssh private key.
    - if: steps.aur.outputs.name
      name: Publish PKGBUILD to arch's user repository.
      uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
      with:
        pkgname: ${{ steps.aur.outputs.name }}
        pkgbuild: PKGBUILD
        assets: ${{ steps.aur.outputs.assets }}
        updpkgsums: true
        # NOTE: Brings updated checksums back to the workspace.
        post_process: sudo cp PKGBUILD /github/workspace/PKGBUILD
        commit_username: ${{ inputs.aur-commit-name || github.actor }}
        commit_email: ${{ inputs.aur-commit-email || format('{0}@users.noreply.github.com', github.actor) }}
        commit_message: Publish new version "${{ steps.prepare-release.outputs.version }}".
        ssh_private_key: ${{ inputs.aur-ssh-private-key }}

    # NOTE: Checksums of published sources (e.g. the npm package) are only
    # known after publishing.
    - if: steps.aur.outputs.name
      uses: EndBug/add-and-commit@v11
      with:
        add: PKGBUILD
        message: Update "PKGBUILD" checksums for version "${{ steps.prepare-release.outputs.version }}".
    # endregion
